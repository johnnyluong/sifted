[project]
name = "sift"
version = "0.1.0"
description = "Turns saved Instagram and Threads posts into goal-scored cards and a weekly digest."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.1.0",
    "apscheduler>=3.11.3",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mlx-whisper>=0.4.3",
    "pydantic-settings>=2.16.1",
    "sqlmodel>=0.0.48",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp>=2026.10.21",
]

[project.scripts]
sift = "sift.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions", ".claude/baseline"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF012"]

[tool.pyright]
include = ["sift", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits real Instagram/Threads/Anthropic; opt in with -m live"]
addopts = "-m 'not live'"
